name: Triage CI Failures

on:
  workflow_run:
    workflows:
      - "CI"
      - "Docker build and release"
      - "Release binaries"
      - "Eth spec tests"
      - "Security audit"
    types: [completed]

# Needed to rerun failed workflows and read job logs
permissions:
  actions: write

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch failed job logs
        id: fetch-logs
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const fs = require('fs');

            // List all jobs for this run, find failed ones
            const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id,
              filter: 'latest',
            });

            const failedJobs = jobs.filter(j => j.conclusion === 'failure');
            const failedJobNames = failedJobs.map(j => j.name);
            core.setOutput('failed_jobs', failedJobNames.join(', '));
            console.log('Failed jobs:', failedJobNames);

            // Download logs for each failed job (up to 3)
            let combinedLogs = '';
            for (const job of failedJobs.slice(0, 3)) {
              try {
                const logsResp = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: job.id,
                });
                const logText = typeof logsResp.data === 'string'
                  ? logsResp.data
                  : JSON.stringify(logsResp.data);
                // Take the last 15000 chars — most relevant for failure diagnosis
                combinedLogs += `\n=== JOB: ${job.name} ===\n${logText.slice(-15000)}\n`;
              } catch (e) {
                combinedLogs += `\n=== JOB: ${job.name} (logs unavailable: ${e.message}) ===\n`;
              }
            }

            fs.writeFileSync('/tmp/failure_logs.txt', combinedLogs.slice(0, 50000));
            console.log(`Collected ${combinedLogs.length} chars of logs`);

      - name: Analyze failure with Claude
        id: analyze
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Analyze the CI failure for zksync-os-server (Rust/blockchain project, Matter Labs).

            Context:
            - Workflow: ${{ github.event.workflow_run.name }}
            - Branch: ${{ github.event.workflow_run.head_branch }}
            - Run attempt: ${{ github.event.workflow_run.run_attempt }}
            - Failed jobs: ${{ steps.fetch-logs.outputs.failed_jobs }}

            Read /tmp/failure_logs.txt and classify the failure as one of:
            - "rerun": Transient infra issue — network timeout, DNS failure, crates.io/registry
              unreachable, GCS/sccache error, docker pull failure, runner OOM, anvil/geth
              startup timing race, GitHub API 5xx, flaky test infrastructure.
            - "escalate": Needs human attention — compilation error, real test assertion failure,
              logic bug, config error, security issue.

            Per-workflow guidance:
            - "CI": Escalate compile/test failures. Rerun Cargo network/GCS issues.
            - "Eth spec tests": Only escalate actual EVM spec assertion failures. Infra → rerun.
            - "Release binaries": Conservative — escalate unless unambiguously network/infra.
            - "Docker build and release": Rerun registry/sccache/GCS issues, escalate build errors.
            - "Security audit": Always escalate — a new advisory always needs review.

            If run_attempt >= 3, always return "escalate".

            Return a JSON object with: decision ("rerun" or "escalate"), reason (one sentence),
            failure_type (short label e.g. "network_timeout", "compile_error", "flaky_infra").
          claude_args: |
            --allowedTools Bash
            --max-turns 3
            --json-schema '{"type":"object","properties":{"decision":{"type":"string","enum":["rerun","escalate"]},"reason":{"type":"string"},"failure_type":{"type":"string"}},"required":["decision","reason","failure_type"]}'

      - name: Extract decision
        id: result
        if: always()
        env:
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RAW: ${{ steps.analyze.outputs.structured_output }}
        run: |
          if [ "${ATTEMPT}" -ge "3" ]; then
            echo "decision=escalate" >> "$GITHUB_OUTPUT"
            echo "reason=Attempt ${ATTEMPT}: max retries reached, escalating regardless of cause" >> "$GITHUB_OUTPUT"
            echo "failure_type=max_retries" >> "$GITHUB_OUTPUT"
          elif [ -z "${RAW}" ]; then
            echo "decision=escalate" >> "$GITHUB_OUTPUT"
            echo "reason=Could not analyze logs (analysis step produced no output)" >> "$GITHUB_OUTPUT"
            echo "failure_type=analysis_error" >> "$GITHUB_OUTPUT"
          else
            python3 - <<'PYEOF'
import json, os
d = json.loads(os.environ['RAW'])
with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
    f.write('decision=' + d['decision'] + '\n')
    f.write('reason=' + d.get('reason', '').replace('\n', ' ') + '\n')
    f.write('failure_type=' + d.get('failure_type', 'unknown').replace('\n', ' ') + '\n')
PYEOF
          fi

      - name: Re-run failed jobs (transient failure)
        if: steps.result.outputs.decision == 'rerun'
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            console.log(`Rerunning failed jobs for run ${run_id}`);
            console.log(`Reason: ${{ steps.result.outputs.reason }}`);
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id,
            });
            console.log('Rerun triggered successfully');

      - name: Notify Slack (real failure requires attention)
        if: steps.result.outputs.decision == 'escalate'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_RELEASES }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*:rotating_light: CI Failure: ${{ github.event.workflow_run.name }}*"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository:*\n`${{ github.repository }}`"
                  - type: "mrkdwn"
                    text: "*Branch:*\n`${{ github.event.workflow_run.head_branch }}`"
                  - type: "mrkdwn"
                    text: "*Failed Jobs:*\n`${{ steps.fetch-logs.outputs.failed_jobs }}`"
                  - type: "mrkdwn"
                    text: "*Attempt:*\n${{ github.event.workflow_run.run_attempt }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Analysis:* ${{ steps.result.outputs.reason }}"
              - type: "actions"
                elements:
                  - type: "button"
                    text:
                      type: "plain_text"
                      text: "View Failed Run"
                      emoji: true
                    url: "${{ github.event.workflow_run.html_url }}"
                    style: "danger"
